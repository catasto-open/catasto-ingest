[tool.poetry]
name = "smidt"
version = "0.4.0"
description = "Smidt workflow for the automatic ingestion to Sister workflow"
authors = ["Francesco Bartoli <francesco.bartoli@geobeyond.it>"]
packages = [
    { include = "smidt", from = "."},
    { include = "smidt/**/*.py", from = "." },
]

[tool.poetry.dependencies]
python = "^3.10"
fs = "^2.4.16"
watchdog = "^3.0.0"
ftputil = "^5.1.0"
filelock = "^3.13.1"
fasteners = "^0.19"
pydantic = "^2.10.4"
loguru = "^0.7.3"
pydantic-settings = "^2.7.1"
minio = "^7.2.14"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2"
mkdocs = "^1.3.1"
pdbpp = {git = "https://github.com/pdbpp/pdbpp", rev = "master"}
pytest-localftpserver = "^1.2.0"
ipython = "^8.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
