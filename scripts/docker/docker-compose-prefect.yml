# up & run Prefect

services:
  prefect:
    image: prefecthq/prefect:2.20.20-python3.10
    restart: always
    volumes:
      - prefect:/root/.prefect
    # entrypoint is installing additional packages
    entrypoint: ["/opt/prefect/entrypoint.sh", "prefect", "server", "start"]
    environment:
      # - PREFECT_UI_URL=http://127.0.0.1:4200/api
      # - PREFECT_API_URL=http://127.0.0.1:4200/api
      # If you want to access Prefect Server UI from anywhere other than the Docker host machine, you will need to change
      # PREFECT_UI_URL and PREFECT_API_URL to match the external hostname/IP of the host machine. For example:
      - PREFECT_UI_URL=http://prefect:4200/api
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_LOGGING_SERVER_LEVEL=DEBUG
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://postgres:postgres@db:5432/prefect
      - PREFECT_API_SERVICES_FLOW_RUN_NOTIFICATIONS_ENABLED=false
      - PREFECT_API_DATABASE_ECHO=False
      - PREFECT_API_DATABASE_MIGRATE_ON_START=True
      # Uncomment the following line if you want to use the 'S3 Bucket' storage block instead of the older 'S3' storage
      - EXTRA_PIP_PACKAGES=s3fs
    ports:
      - 4200:4200
    depends_on:
      - db
    networks:
      - prefect-network
    profiles: ["server"]

  prefect_work_queue_catasto:
    image: prefecthq/prefect:2.20.20-python3.10
    entrypoint: ["/opt/prefect/entrypoint.sh", "prefect", "work-queue", "create", "catasto-queue"]
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - EXTRA_PIP_PACKAGES=s3fs
    restart: always
    depends_on:
      - prefect
      - db
    networks:
      - prefect-network
    profiles: ["queue"]

  prefect_work_pool_catasto:
    image: prefecthq/prefect:2.20.20-python3.10
    entrypoint: ["/opt/prefect/entrypoint.sh", "prefect", "work-pool", "create", "--type", "process", "catasto-pool"]
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - EXTRA_PIP_PACKAGES=s3fs
    restart: always
    depends_on:
      - prefect
      - db
      - prefect_work_queue_catasto
    networks:
      - prefect-network
    profiles: ["pool"]

  prefect_worker_catasto:
    image: prefecthq/prefect:2.20.20-python3.10
    entrypoint: ["/opt/prefect/entrypoint.sh", "prefect", "worker", "start", "--pool", "catasto-pool"]
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - EXTRA_PIP_PACKAGES=s3fs
    restart: always
    depends_on:
      - prefect
      - db
      - prefect_work_pool_catasto
    networks:
      - prefect-network
    profiles: ["worker"]

  db:
    image: postgres:15.2-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prefect
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - prefect-network
    profiles: ["server"]

  ### MinIO for flow storage
  minio:
    image: minio/minio:latest
    entrypoint: ["minio", "server", "--address", "0.0.0.0:9000", "--console-address", "0.0.0.0:9001", "/data"]
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - "minio:/data"
    networks:
      - prefect-network
    profiles: ["minio"]

  ### Prefect CLI
  cli:
    image: prefecthq/prefect:2.20.20-python3.10
    entrypoint: ["/opt/prefect/entrypoint.sh", "bash"]
    working_dir: "/root/catasto"
    volumes:
      - "./../../:/root/catasto"
      # hack to not load local .venv from host machine
      - cli:/root/catasto/.venv
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - EXTRA_PIP_PACKAGES=s3fs poetry
    networks:
      - prefect-network
    profiles: ["cli"]

volumes:
  prefect:
    driver: local
  db:
    driver: local
  minio:
    driver: local
  cli:
    driver: local
networks:
  prefect-network:
    name: prefect-network
